<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOWHQ | Discord</title>
    <meta name="description" content="Join the SHADOWHQ Discord server.">
    <link rel="icon" type="image/gif" href="logo.gif">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanline"></div>
    <div class="grid-overlay"></div>

    <header>
        <nav>
            <div class="brand"><img src="logo.gif" alt="SHADOWHQ" class="brand-logo"> SHADOWHQ</div>
            <div class="nav-links">
                <a href="#hero">Home</a>
                <a href="#stats">Stats</a>
                <a href="#join" class="btn-outline">Join Discord</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="fade-element">
            <div class="hero-left">
                <h1>
                    <span class="glitch" data-text="SHADOWHQ">SHADOWHQ</span>
                    <br><span class="text-accent">DISCORD</span>
                </h1>
                <p id="typewriter"><span class="cursor"></span></p>
                <div class="hero-cta">
                    <a href="https://discord.gg/3JsaVVGMgW" class="btn-primary" target="_blank" rel="noopener noreferrer">JOIN DISCORD</a>
                </div>
            </div>

            <div class="hero-right">
                <div class="hero-glow"></div>
                <div class="discord-frame">
                    <div class="discord-inner">
                        <img src="logo.gif" alt="SHADOWHQ Discord">
                    </div>
                    <div class="discord-badge">
                        <span class="dot"></span>
                        <span id="badgeCount">Join</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="stats" class="fade-element">
            <div class="section-header">
                <h2>LIVE DISCORD STATS</h2>
                <p>Real-time data from our Discord server</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" data-target="members">0</div>
                    <div class="stat-label">Total Members</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" data-target="online">0</div>
                    <div class="stat-label">Online Now</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" data-target="boosts">0</div>
                    <div class="stat-label">Server Boosts</div>
                </div>
            </div>
        </section>

        <section id="join" class="fade-element">
            <div class="form-container">
                <h2>JOIN SHADOWHQ</h2>
                <p>Jump into the Discord and be part of the server.</p>
                <a href="https://discord.gg/3JsaVVGMgW" class="btn-primary w-100" target="_blank" rel="noopener noreferrer">OPEN DISCORD</a>
            </div>
        </section>
    </main>

    <footer>
        <p>SHADOWHQ &copy; 2026.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
